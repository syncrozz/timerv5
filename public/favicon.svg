<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Pitch Black Solid Background -->
  <rect width="512" height="512" fill="#000000" />

  <!-- Top Crown / Knob -->
  <rect x="226" y="72" width="60" height="18" rx="9" fill="url(#purpleGlow)" filter="url(#neonBlur)" />
  <rect x="240" y="86" width="32" height="16" rx="4" fill="url(#purpleGlow)" filter="url(#neonBlur)" />

  <!-- Outer Main Timer Circle Ring -->
  <circle cx="256" cy="272" r="170" fill="none" stroke="url(#purpleGlow)" stroke-width="16" filter="url(#neonBlur)" />

  <!-- Inner Play Button Badge -->
  <circle cx="256" cy="196" r="44" fill="none" stroke="url(#purpleGlow)" stroke-width="8" filter="url(#neonBlur)" />
  <path d="M 244,178 L 276,196 L 244,214 Z" fill="#ffffff" />

  <!-- ONE TAP Bold Text -->
  <text x="256" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">ONE TAP</text>
</svg>
